[package]
name = "keysounds"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
evdev = "0.13.2"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis", "mp3", "wav", "pcm"] }
